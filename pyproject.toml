[build-system]
requires = ["poetry-core", "poetry-dynamic-versioning"]
build-backend = "poetry.core.masonry.api"

[project]
name = "korpuskulum"
dynamic = ["version"]
description = "Package to evaluate particle distribution with respect to segmented membranes"
authors = [
    {name = "Neville B.-y. Yee"}
]
license = {text = "Apache License V.3"}
readme = "README.md"
packages = [{include = "korpuskulum"}]


requires-python = ">=3.10"
dependencies = [
    "tifffile",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "rich",
    "typer",
    "starfile",
    "pandas",
    "icecream"
]

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"

[tool.poetry-dynamic-versioning.from-file]
source = "korpuskulum/__init__.py"
pattern = '''^__version__\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+.*?)"'''

[tool.poetry]
version = "0.0.0" # Placeholder only - change version number in __init__ file.
[tool.poetry.scripts]
korpus = "korpuskulum.main:app"